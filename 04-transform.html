<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            div {
                width: 100px;
                height: 100px;
                background: red;
                margin: 50px auto;
                color: #fff;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            #box01 {
                transition: all 0.5s;
            }
            #box01:hover {
                backgound: yellow;
                transform: scale(2, 1.5);
            }
            #box02 {
                transition: cubic-bezier(0.87, 0, 0.18, 0.99);
            }
            #box02:hover {
                background: green;
                transform: rotate(180deg);
            }
            #box03 {
                transition: all 0.5s;
            }
            #box03:hover {
                background: blue;
                transform: skewX(15deg);
            }
            #box04 {
                transition: all 1s;
            }
            #box04:hover {
                background: peru;
                transform: translate(200px, -100px);
            }
            #box05 {
                transition: all 0.5s;
            }
            #box05:hover {
                background: violet;
                transform: scale(2) rotate(60deg);
            }
            #box06 {
                transition: all 0.5s;
            }
            #box06:hover {
                transform-origin: left top;
                transform: rotate(60deg);
            }
        </style>
    </head>
    <body>
        <div id="box01">scale</div>
        <div id="box02">rotate</div>
        <div id="box03">skew</div>
        <div id="box04">transform</div>
        <div id="box05">all</div>
        <div id="box06">origin</div>
    </body>
</html>
